<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/yumurta-cari-takip/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yumurta satışı, koli, fiyat ve cari hesap takibi.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yumurta Cari">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Yumurta Cari Takip</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((item) => item.unregister()));
      }
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.map((name) => caches.delete(name)));
      }

      let cacheVersion = Date.now().toString();
      try {
        const response = await fetch(`version.json?t=${cacheVersion}`, {
          cache: 'no-store',
        });
        if (response.ok) {
          const version = await response.json();
          cacheVersion = version.build_number ?? cacheVersion;
        }
      } catch (_) {
        // Date.now() remains a safe cache buster when version.json is unavailable.
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?v=${encodeURIComponent(cacheVersion)}`;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
